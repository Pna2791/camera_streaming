<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Setup - IP Camera Streaming</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="top-nav">
                <a href="../index.html" class="nav-link">📹 Stream</a>
                <a href="setup.html" class="nav-link active">⚙️ Setup</a>
            </nav>
            <h1>⚙️ Camera Setup</h1>
            <p class="subtitle">Configure your IP camera settings</p>
        </header>

        <div class="setup-section">
            <h2>📡 Network Camera Scanner</h2>
            <div class="scan-controls">
                <div class="input-group">
                    <label for="networkRange">Network Range:</label>
                    <input 
                        type="text" 
                        id="networkRange" 
                        placeholder="192.168.1.0/24"
                        value="192.168.1.0/24"
                    >
                    <small>Enter network range (e.g., 192.168.1.0/24)</small>
                </div>
                <button id="scanBtn" class="btn btn-primary">
                    <span id="scanBtnText">🔍 Scan Network</span>
                </button>
            </div>

            <div id="scanResults" class="scan-results" style="display: none;">
                <h3>Found Cameras:</h3>
                <div id="cameraList" class="camera-list"></div>
            </div>
        </div>

        <div class="setup-section">
            <h2>📝 Manual Camera Configuration</h2>
            <form id="cameraForm" class="camera-form">
                <div class="form-group">
                    <label for="cameraIp">Camera IP Address:</label>
                    <input 
                        type="text" 
                        id="cameraIp" 
                        name="cameraIp"
                        placeholder="192.168.1.8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="cameraPort">RTSP Port:</label>
                    <input 
                        type="number" 
                        id="cameraPort" 
                        name="cameraPort"
                        placeholder="554"
                        value="554"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="cameraUsername">Username:</label>
                    <input 
                        type="text" 
                        id="cameraUsername" 
                        name="cameraUsername"
                        placeholder="admin"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="cameraPassword">Password:</label>
                    <input 
                        type="password" 
                        id="cameraPassword" 
                        name="cameraPassword"
                        placeholder="Enter camera password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="cameraPath">RTSP Path:</label>
                    <select id="cameraPath" name="cameraPath">
                        <option value="/cam/realmonitor?channel=1&subtype=0&unicast=true&proto=Onvif">IMOU / Onvif (Default)</option>
                        <option value="/stream1">Generic Stream 1</option>
                        <option value="/stream2">Generic Stream 2</option>
                        <option value="/Streaming/Channels/101">Hikvision Channel 1</option>
                        <option value="/Streaming/Channels/102">Hikvision Channel 2</option>
                        <option value="/live">Generic /live</option>
                        <option value="/">Root</option>
                        <option value="custom">Custom Path</option>
                    </select>
                </div>

                <div class="form-group" id="customPathGroup" style="display: none;">
                    <label for="customPath">Custom RTSP Path:</label>
                    <input 
                        type="text" 
                        id="customPath" 
                        name="customPath"
                        placeholder="/your/custom/path"
                    >
                </div>

                <div class="form-group">
                    <label for="cameraName">Camera Name (optional):</label>
                    <input 
                        type="text" 
                        id="cameraName" 
                        name="cameraName"
                        placeholder="Living Room Camera"
                    >
                </div>

                <div class="button-group">
                    <button type="button" id="testBtn" class="btn btn-secondary">Test Connection</button>
                    <button type="submit" id="saveBtn" class="btn btn-primary">Save Configuration</button>
                </div>
            </form>
        </div>

        <div class="setup-section">
            <h2>💾 Saved Cameras</h2>
            <div id="savedCameras" class="saved-cameras">
                <p class="no-cameras">No cameras saved yet. Add one above.</p>
            </div>
        </div>
    </div>

    <script src="../js/camera-setup.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
