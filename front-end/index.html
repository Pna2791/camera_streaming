<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Camera Stream - WebRTC</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="top-nav">
                <a href="index.html" class="nav-link active">📹 Stream</a>
                <a href="pages/setup.html" class="nav-link">⚙️ Setup</a>
            </nav>
            <h1>📹 IP Camera Live Stream</h1>
            <p class="subtitle">Real-time video streaming via WebRTC</p>
        </header>

        <div class="controls">
            <div class="input-group">
                <label for="streamUrl">Stream URL:</label>
                <input 
                    type="text" 
                    id="streamUrl" 
                    placeholder="http://localhost:8555/camera"
                    value="http://192.168.1.8:8555/camera"
                >
            </div>
            <div class="input-group">
                <label for="authUsername">MediaMTX Username (optional):</label>
                <input 
                    type="text" 
                    id="authUsername" 
                    placeholder="Only if MediaMTX requires authentication"
                >
                <small style="color: #6c757d; font-size: 0.85em;">Leave empty if no authentication is configured</small>
            </div>
            <div class="input-group">
                <label for="authPassword">MediaMTX Password (optional):</label>
                <input 
                    type="password" 
                    id="authPassword" 
                    placeholder="Only if MediaMTX requires authentication"
                >
            </div>
            <div class="button-group">
                <button id="connectBtn" class="btn btn-primary">Connect</button>
                <button id="disconnectBtn" class="btn btn-secondary" disabled>Disconnect</button>
            </div>
        </div>

        <div class="status" id="status">
            <span class="status-indicator" id="statusIndicator"></span>
            <span id="statusText">Ready to connect</span>
        </div>

        <div class="video-container">
            <video 
                id="videoPlayer" 
                autoplay 
                playsinline
                muted
            ></video>
            <div class="video-overlay" id="videoOverlay">
                <p>No stream connected</p>
            </div>
        </div>

        <div class="info-panel">
            <h3>Stream Information</h3>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span class="info-value" id="infoStatus">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Resolution:</span>
                    <span class="info-value" id="infoResolution">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">FPS:</span>
                    <span class="info-value" id="infoFPS">-</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/webrtc-player.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/stream-integration.js"></script>
</body>
</html>
